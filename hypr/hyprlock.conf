1animations {
    enabled = true
    
    # Define your custom ultra-smooth cubic-bezier curve
    bezier = customEase, 0.16, 1, 0.3, 1
    
    # Apply the curve specifically to the window fading and elements movement
    animation = fadeIn, 1, 4, customEase
}


general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
    color = rgba(12, 28, 84, 1.0)
}

# ---------- Thin vertical clock ----------
label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='100'>$(date +%I)</span>"
    color = rgba(255, 105, 180, 1.0)
    font_size = 64
    font_family = Google Sans Flex 9pt Bold
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(0, 242, 254, 0.1)
    position = 0, 215
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='100'>$(date +%M)</span>"
    color = rgba(255, 182, 193, 1.0)
    font_size = 64
    font_family = Google Sans Flex 9pt Bold
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(0, 242, 254, 0.1)
    position = 0, 140
    halign = center
    valign = center
}

# AM/PM and date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%p  •  %A, %d %B")"
    color = rgba(255, 255, 255, 0.7)
    font_size = 15
    font_family = Google Sans Flex 9pt
    position = 0, 85
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hey There!! Where will you dive?
    color = rgba(169, 185, 255, 1.0)
    font_size = 20
    font_family = Google Sans Flex 9pt
    position = 0, 45
    halign = center
    valign = center
}

# ---------- Password box ----------
input-field {
    monitor =
    size = 300, 54
    rounding = 27
    outline_thickness = 0
    outer_color = rgba(169, 185, 255, 0.9)
    inner_color = rgba(211, 211, 211, 0.2)
    font_color = rgba(211, 211, 211, 0.6)
    font_family = Google Sans Flex 9pt
    fade_on_empty = false
    dots_size = 0.20
    dots_spacing = 0.3
    dots_center = true
    placeholder_text = Enter your Password
    position = 0, -40
    halign = center
    valign = center
}

# ---------- Widget card 1: Battery ----------
shape {
    monitor =
    size = 210, 74
    color = rgba(255, 255, 255, 0.10)
    rounding = 45
    border_size = 5
    border_color = rgba(255, 255, 255, 0.18)
    position = -235, -270
    halign = center
    valign = center
}

label {
    monitor =
    text = Battery
    color = rgba(169, 185, 255, 1.0)
    font_size = 11
    font_family = Google Sans Flex 9pt
    position = -235, -252
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] echo "$(cat /sys/class/power_supply/BAT*/capacity | head -1)%"
    color = rgba(255, 255, 255, 1.0)
    font_size = 22
    font_family = Google Sans Flex 9pt
    position = -235, -283
    halign = center
    valign = center
}

# ---------- Widget card 2: RAM / CPU ----------
shape {
    monitor =
    size = 210, 74
    color = rgba(255, 255, 255, 0.10)
    rounding = 45
    border_size = 5
    border_color = rgba(255, 255, 255, 0.18)
    position = 0, -270
    halign = center
    valign = center
}

label {
    monitor =
    text = RAM  •  CPU
    color = rgba(169, 185, 255, 1.0)
    font_size = 11
    font_family = Google Sans Flex 9pt
    position = 0, -252
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] echo "$(free | awk '/Mem/{printf "%d", $3/$2*100}')%  •  $(top -bn1 | awk '/Cpu/{print int($2+$4)}')%"
    color = rgba(255, 255, 255, 1.0)
    font_size = 20
    font_family = Google Sans Flex 9pt
    position = 0, -283
    halign = center
    valign = center
}

# ---------- Widget card 3: Uptime ----------
shape {
    monitor =
    size = 210, 74
    color = rgba(255, 255, 255, 0.10)
    rounding = 45
    border_size = 5
    border_color = rgba(255, 255, 255, 0.18)
    position = 235, -270
    halign = center
    valign = center
}

label {
    monitor =
    text = System Uptime
    color = rgba(169, 185, 255, 1.0)
    font_size = 11
    font_family = Google Sans Flex 9pt
    position = 235, -252
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(uptime -p | sed 's/up //; s/ hours\?/h/; s/ minutes\?/m/; s/,//')"
    color = rgba(255, 255, 255, 1.0)
    font_size = 20
    font_family = Google Sans Flex 9pt
    position = 235, -283
    halign = center
    valign = center
}

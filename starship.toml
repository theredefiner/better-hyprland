# Get a clean two-line prompt layout
format = """
$username$hostname$directory$git_branch$git_status
$character"""

# Don't print a new line between prompts
add_newline = false

# ==========================================
# Prompt Character (The Input Pointer)
# ==========================================
[character]
success_symbol = "[](bold green) "
error_symbol = "[](bold red) "

# ==========================================
# Directory (Folders)
# ==========================================
[directory]
style = "bold cyan"
# The icon is mapped explicitly inside the format key here:
format = "in [ $path]($style)[$read_only]($read_only_style) "
read_only = " "
truncation_length = 3
truncation_symbol = "…/"

# ==========================================
# Git / Source Control
# ==========================================
[git_branch]
style = "bold magenta"
symbol = " "
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "[$all_status$ahead_behind]($style)"
conflicted = " "
ahead = " "
behind = " "
diverged = " "
untracked = " "
stashed = " "
modified = " "
staged = " "
renamed = " "
deleted = " "

# ==========================================
# Username & Hostname
# ==========================================
[username]
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style) "
disabled = false
show_always = false

[hostname]
ssh_only = true
format = "on [$hostname](bold yellow) "
disabled = false

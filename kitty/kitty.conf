# ==========================================
# Fonts
# ==========================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# This makes only the background transparent; text stays 100% opaque
background_opacity 0.35

# ==========================================
# Shell
# ==========================================
# Points Kitty to use the Fish Shell. 
# (If your fish binary is elsewhere, change the path accordingly)
shell /usr/bin/fish


# BEGIN_KITTY_THEME
# Base2Tone Lavender Dark
include current-theme.conf
# END_KITTY_THEME
